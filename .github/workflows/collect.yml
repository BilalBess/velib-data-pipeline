name: Collect Velib snapshot

# Every hour: download the state of all stations, check data quality, and append it to the `data` branch.
# (GitHub may delay scheduled runs by a few minutes, and pauses them after 60 days without repository activity.)
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collect.txt
      - run: pip install -r requirements-collect.txt
      - name: Get the data branch (or start it)
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch data "$REPO_URL" data_branch
          else
            mkdir data_branch && git -C data_branch init -q -b data
            git -C data_branch remote add origin "$REPO_URL"
          fi
      - name: Collect one snapshot
        run: python src/collect.py --out data_branch/raw
      - name: Commit and push to the data branch
        working-directory: data_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push origin data
